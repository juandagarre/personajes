<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prueba de audios</title>
</head>

<body>

<h2>Prueba de audios desde GitHub</h2>

<button onclick="reproducir('01.mp3')">
    ▶ Reproducir audio 01
</button>

<button onclick="reproducir('02.mp3')">
    ▶ Reproducir audio 02
</button>

<button onclick="parar()">
    ■ Parar audio
</button>

<p id="estado">Preparado</p>

<audio id="audio" preload="auto"></audio>

<script>

const audio = document.getElementById("audio");
const estado = document.getElementById("estado");

function reproducir(archivo) {

    // Detener cualquier audio anterior
    audio.pause();
    audio.currentTime = 0;

    // Buscar el archivo dentro de la carpeta audios
    audio.src = "audios/" + archivo;

    estado.textContent = "Intentando reproducir " + archivo + "...";

    audio.play()
        .then(() => {
            estado.textContent = "Reproduciendo " + archivo;
        })
        .catch(error => {
            estado.textContent =
                "ERROR: " + error.name + " - " + error.message;
        });
}

function parar() {

    audio.pause();
    audio.currentTime = 0;

    estado.textContent = "Parado";
}

audio.addEventListener("ended", () => {
    estado.textContent = "Terminado";
});

audio.addEventListener("error", () => {
    estado.textContent = "ERROR al cargar el audio";
});

</script>

</body>
</html>
