<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplicación de Personajes</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
            
            --color-listen: #2563eb;       /* Azul para escuchar */
            --color-read: #0d9488;         /* Teal para leer */
            --color-controls: #64748b;      /* Gris pizarra para controles */
            --color-hide: #334155;          /* Gris oscuro para ocultar */
            --color-goto: #7c3aed;          /* Morado para ir a preguntas */
            --color-nav: #d97706;           /* Naranja para navegación */

            /* Colores amarillentos para la primera página */
            --char-btn-bg: #fef9c3;         
            --char-btn-border: #fde047;     
            --char-btn-hover: #facc15;      
            --char-btn-text: #713f12;       
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            width: 100%;
            max-width: 700px;
            padding: 30px;
            box-sizing: border-box;
        }

        h1, h2 {
            color: var(--color-listen);
            text-align: center;
            margin-top: 0;
            margin-bottom: 20px;
        }

        .view {
            display: none;
        }

        .view.active {
            display: block;
        }

        .character-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 10px;
            max-height: 450px;
            overflow-y: auto;
            padding: 5px;
            margin-top: 15px;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: #f1f5f9;
        }

        .character-btn {
            background-color: var(--char-btn-bg);
            color: var(--char-btn-text);
            border: 1px solid var(--char-btn-border);
            padding: 12px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            transition: all 0.2s;
        }

        .character-btn:hover {
            background-color: var(--char-btn-hover);
            border-color: #ca8a04;
            transform: translateY(-1px);
        }

        .text-box {
            background-color: #f1f5f9;
            padding: 15px 20px;
            border-radius: 8px;
            line-height: 1.6;
            margin-top: 15px;
            margin-bottom: 15px;
            max-height: 250px;
            overflow-y: auto;
            display: none;
        }

        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 12px;
            justify-content: center;
        }

        button {
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        .btn-listen { background-color: var(--color-listen); }
        .btn-read { background-color: var(--color-read); }
        .btn-controls { background-color: var(--color-controls); }
        .btn-hide { background-color: var(--color-hide); width: 100%; }
        .btn-goto { background-color: var(--color-goto); width: 100%; }
        .btn-nav { background-color: var(--color-nav); }

        .nav-buttons-top {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            margin-bottom: 15px;
        }

        .nav-buttons-bottom {
            display: flex;
            justify-content: center;
            gap: 10px;
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
        }

        .counter {
            text-align: center;
            font-weight: bold;
            color: #64748b;
            margin-bottom: 10px;
        }

        .question-card {
            background-color: #f8fafc;
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 8px;
            min-height: 90px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            margin-bottom: 20px;
            font-size: 18px;
            font-weight: 500;
        }

        .section-title {
            font-size: 13px;
            font-weight: bold;
            color: #64748b;
            text-transform: uppercase;
            margin-top: 15px;
            margin-bottom: 8px;
            text-align: center;
        }

        .menu-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
        }
    </style>
</head>

<div class="container">

    <div id="view-selector" class="view active">

                <option value="en_GB">🇬🇧 Inglés Reino Unido</option>
                <option value="en_US">🇺🇸 Inglés Estados Unidos</option>
            </select>
        </div>

        <div class="btn-group">
            <button class="btn-listen" onclick="iniciarLectura('en')">🔊 Escuchar EN</button>
            <button class="btn-listen" onclick="iniciarLectura('es')">🔊 Escuchar ES</button>
        </div>

        <div class="btn-group">
            <button class="btn-controls" onclick="pausarVoz()">⏸️ Parar</button>
            <button class="btn-controls" onclick="reanudarVoz()">▶️ Reanudar</button>
            <button class="btn-controls" onclick="reiniciarVoz()">⏮️ Desde el principio</button>
        </div>

        <div class="btn-group">
            <button class="btn-read" onclick="mostrarTexto('en')">📄 Leer EN</button>
            <button class="btn-read" onclick="mostrarTexto('es')">📄 Leer ES</button>
        </div>

        <div class="text-box" id="content-text"></div>

        <div class="menu-options">
            <div>
                <button class="btn-hide" onclick="ocultarTextoPrincipal()">👁️‍🗨️ Ocultar texto</button>
            </div>
            <div>
                <button class="btn-goto" onclick="abrirPreguntas()">Ir a Preguntas</button>
            </div>
        </div>

        <div style="margin-top: 20px; text-align: center; border-top: 1px solid var(--border-color); padding-top: 15px;">
            <button class="btn-controls" onclick="volverAlSelector()">👥 Cambiar Personaje</button>
        </div>
    </div>

    <!-- VISTA 2: PREGUNTAS Y RESPUESTAS -->
    <div id="view-questions" class="view">
        <div class="counter" id="question-counter">Pregunta 1 de 1</div>
        
        <div class="question-card">

        </div>

        </div>
        <div class="btn-group">
            <button class="btn-listen" onclick="hablarContenido('es', 'pregunta')">🔊 Escuchar ES</button>
            <button class="btn-read" onclick="mostrarContenido('es', 'pregunta')">👁️ Leer ES</button>

        <div class="section-title">Respuesta</div>

        <div class="nav-buttons-top">

        <div class="nav-buttons-bottom">

            <button class="btn-controls" onclick="volverAlSelector()">👥 Cambiar Personaje</button>
        </div>
    </div>
</div>

        textoIngles: "Li Tong has been taking English lessons for the past four months. At first, he thought he wasn't capable of learning even the simplest forms of the language. However, thanks to the help his daughter has given him and thanks to a positive teacher change in the language school, Li's made excellent progress. Every night, he and his daughter study the language for about 30 minutes. The new teacher that Li has in the language school speaks perfect Chinese. He's from Ireland, but he's been living in Shanghai since he was 14 years old. His name is Pat Riley and he's 24. Both of his parents are professors at the Shanghai University. Over the past three weeks, Pat has spoken to Li several times about what he should do to speed up the learning process. He gave Li an audio tape and told him to take it to work and leave it on all day while he was working in the factory. He told him not to worry if he didn't understand what the people were saying in the tape. In fact, he told him not to listen to it, but to pay attention to his work, keeping the English sound within earshot. According to Pat, Li would slowly get used to hearing English sounds and become familiar with the cadence, intonation, and phonetics. If Li did this over a period of one year, for example, he would progress twice as fast because he'd find the new forms taught in class easier to assimilate. The sounds would be familiar to him. Pat reminded him that children absorb their mother tongue quickly because they are surrounded by it 15 hours a day over several years. He told Li that he should take advantage of the eight hours he spends everyday at his worktable to simulate this kind of language atmosphere. Li followed Pat's advice and has been keeping the audio tape on at his worktable for the past two weeks. He even plays the tape at home as background music. He's already starting to recognize certain sounds and, more importantly, he's starting to feel comfortable with the language during the class sessions.",
        textoEspanol: "Li Tong ha estado tomando clases de inglés durante los últimos cuatro meses. Al principio, pensaba que no era capaz de aprender ni las formas más simples del idioma. Sin embargo, gracias a la ayuda que le ha dado su hija y a un cambio positivo de profesor en la escuela de idiomas, Li ha hecho un progreso excelente. Todas las noches, él y su hija estudian el idioma durante unos 30 minutos. El nuevo profesor que tiene Li en la escuela de idiomas habla un chino perfecto. Es de Irlanda, pero ha estado viviendo en Shanghái desde que tenía 14 años. Su nombre es Pat Riley y tiene 24 años. Ambos padres son profesores en la Universidad de Shanghái. Durante las últimas tres semanas, Pat le ha hablado a Li varias veces sobre lo que debería hacer para acelerar el proceso de aprendizaje. Le dio una cinta de audio y le dijo que se la llevara al trabajo y la dejara puesta todo el día mientras trabajaba en la fábrica. Le dijo que no se preocupara si no entendía lo que la gente decía en la cinta. De hecho, le dijo que no la escuchara, sino que prestara atención a su trabajo, manteniendo el sonido del inglés al alcance del oído. Según Pat, Li se iría acostumbrando poco a poco a escuchar los sonidos del inglés y se familiarizaría con la cadencia, la entonación y la fonética. Si Li hiciera esto durante un período de un año, por ejemplo, progresaría el doble de rápido porque le resultaría más fácil asimilar las nuevas formas enseñadas en clase. Los sonidos le resultarían familiares. Pat le recordó que los niños absorben su lengua materna rápidamente porque están rodeados de ella 15 horas al día durante varios años. Le dijo a Li que debería aprovechar las ocho horas que pasa todos los días en su mesa de trabajo para simular este tipo de ambiente lingüístico. Li siguió el consejo de Pat y ha estado manteniendo la cinta de audio encendida en su mesa de trabajo durante las últimas dos semanas. Incluso pone la cinta en casa como música de fondo. Ya está empezando a rec         document.getElementById('view-questions').classList.remove('active');
    }

    function volverAlSelector() {
        window.speechSynthesis.cancel();
        detenerAudioGrabado();
        estadoAudio = 'detenido';
        document.getElementById('app-title').innerText = "Selecciona un Personaje";
        document.getElementById('view-text').classList.remove('active');
        document.getElementById('view-questions').classList.remove('active');
        document.getElementById('view-selector').classList.add('active');
    }

    function mostrarTexto(lang) {
        const caja = document.getElementById('content-text');
        const p = personajes[personajeActualId];
        caja.innerText = (lang === 'en') ? p.textoIngles : p.textoEspanol;
        caja.style.display = 'block';
    }

    function ocultarTextoPrincipal() {
        document.getElementById('content-text').style.display = 'none';
    }

    function obtenerVozSeleccionada(idSelector) {
        const selector = document.getElementById(idSelector);
        const idioma = selector ? selector.value.replace('_', '-').toLowerCase() : '';
        const voces = window.speechSynthesis.getVoices();
        return voces.find(v => v.lang.replace('_', '-').toLowerCase() === idioma) || null;
    }

    // ----------------------------------------------------
    // AUDIOS GRABADOS — 68 PERSONAJES
    // ----------------------------------------------------
    let audioGrabadoActual = null;

    function esAudioGrabadoSeleccionado(lang) {
        if (lang !== 'en') return false;
        const selector = document.getElementById('select-voz-en');
        return selector && selector.value === 'audio_grabado_48kbps';
    }

    function reproducirAudioGrabado() {
        const selector = document.getElementById('select-voz-en');
        if (!selector) return;

        const numero = String(personajeActualId).padStart(2, '0');
        const archivo = numero + '.mp3';
        const rutaAudio = 'audios/' + archivo;

        if (audioGrabadoActual) {
            audioGrabadoActual.pause();
            audioGrabadoActual.currentTime = 0;
        }

        audioGrabadoActual = new Audio();
        audioGrabadoActual.preload = 'auto';
        audioGrabadoActual.src = new URL(rutaAudio, document.baseURI).href;
        const selectorVelocidad = document.getElementById('velocidad-lectura');
        audioGrabadoActual.playbackRate = selectorVelocidad ? parseFloat(selectorVelocidad.value) : 1;
        audioGrabadoActual.onplay = function() { estadoAudio = 'reproduciendo'; };
        audioGrabadoActual.onended = function() { estadoAudio = 'detenido'; };
        audioGrabadoActual.onerror = function() {
            estadoAudio = 'detenido';
            alert('No se ha podido cargar el audio grabado.\n\nArchivo buscado: ' + archivo + '\nCarpeta esperada: audios/\nRuta: ' + audioGrabadoActual.src);
        };

        estadoAudio = 'reproduciendo';
        const promesa = audioGrabadoActual.play();
        if (promesa && typeof promesa.catch === 'function') {
            promesa.catch(function(error) {
                estadoAudio = 'detenido';
                alert('El navegador no ha podido iniciar el audio grabado.\n\nArchivo: ' + archivo + '\nMotivo: ' + (error && error.message ? error.message : error));
            });
        }
    }

    function detenerAudioGrabado() {
        if (audioGrabadoActual) {
            audioGrabadoActual.pause();
            audioGrabadoActual.currentTime = 0;
        }
    }

    function pausarAudioGrabado() {
        if (audioGrabadoActual && !audioGrabadoActual.paused) {
            audioGrabadoActual.pause();
            estadoAudio = 'pausado';
        }
    }

    function reanudarAudioGrabado() {
        if (audioGrabadoActual && audioGrabadoActual.paused && audioGrabadoActual.currentTime > 0) {
            const selectorVelocidad = document.getElementById('velocidad-lectura');
            audioGrabadoActual.playbackRate = selectorVelocidad ? parseFloat(selectorVelocidad.value) : 1;
            const promesa = audioGrabadoActual.play();
            if (promesa && typeof promesa.catch === 'function') {
                promesa.catch(function(error) { estadoAudio = 'detenido'; });
            }
            estadoAudio = 'reproduciendo';
        }
    }

    function iniciarLectura(lang) {
        window.speechSynthesis.cancel();
        detenerAudioGrabado();

        if (esAudioGrabadoSeleccionado(lang)) {
            idiomaAudioActual = lang;
            reproducirAudioGrabado();
            return;
        }

        idiomaAudioActual = lang;
        const p = personajes[personajeActualId];
        const textoCompleto = (lang === 'en') ? p.textoIngles : p.textoEspanol;
        frasesTexto = textoCompleto.match(/[^.!?]+[.!?]+/g) || [textoCompleto];
        indiceFraseActual = 0;
        estadoAudio = 'reproduciendo';
        reproducirSiguienteFrase();
    }

    function reproducirSiguienteFrase() {
        if (estadoAudio !== 'reproduciendo') return;
        if (indiceFraseActual < frasesTexto.length) {
            const texto = frasesTexto[indiceFraseActual].trim();
            const utterance = new SpeechSynthesisUtterance(texto);
            const selectorVelocidad = document.getElementById('velocidad-lectura');
            utterance.rate = selectorVelocidad ? parseFloat(selectorVelocidad.value) : 1;

            const selectorVoz = (idiomaAudioActual === 'en') ? 'select-voz-en' : 'select-voz-es';
            const voz = obtenerVozSeleccionada(selectorVoz);
            if (voz) {
                utterance.voice = voz;
                utterance.lang = voz.lang;
            } else {
                utterance.lang = (idiomaAudioActual === 'en') ? 'en-US' : 'es-ES';
            }

            utterance.onend = function() {
                if (estadoAudio === 'reproduciendo') {
                    indiceFraseActual++;
                    // Pausa breve entre frases para que la lectura resulte más natural.
                    setTimeout(reproducirSiguienteFrase, 300);
                }
            };
            window.speechSynthesis.speak(utterance);
        } else {
            estadoAudio = 'detenido';
        }
    }

    function pausarVoz() {
        if (esAudioGrabadoSeleccionado('en') && audioGrabadoActual && !audioGrabadoActual.paused) {
            pausarAudioGrabado();
            return;
        }
        if (estadoAudio === 'reproduciendo') {
            window.speechSynthesis.cancel();
            estadoAudio = 'pausado';
        }
    }

    function reanudarVoz() {
        if (esAudioGrabadoSeleccionado('en') && audioGrabadoActual && audioGrabadoActual.paused && audioGrabadoActual.currentTime > 0) {
            reanudarAudioGrabado();
            return;
        }
        if (estadoAudio === 'pausado') {
            estadoAudio = 'reproduciendo';
            reproducirSiguienteFrase();
        }
    }

    function reiniciarVoz() {
        window.speechSynthesis.cancel();
        detenerAudioGrabado();
        if (document.getElementById('view-text').classList.contains('active')) {
            iniciarLectura(idiomaAudioActual);
        }
    }

    function abrirPreguntas() {
        window.speechSynthesis.cancel();
        detenerAudioGrabado();
        estadoAudio = 'detenido';
        currentIndex = 0;
        document.getElementById('view-text').classList.remove('active');
        document.getElementById('view-questions').classList.add('active');
        actualizarContadorUI();
        ocultarContenido();
    }

    function volverAlTexto() {
        window.speechSynthesis.cancel();
        detenerAudioGrabado();
        estadoAudio = 'detenido';
        document.getElementById('view-questions').classList.remove('active');
        document.getElementById('view-text').classList.add('active');
    }

    function actualizarContadorUI() {
        const p = personajes[personajeActualId];
        document.getElementById('question-counter').innerText = `Pregunta ${currentIndex + 1} de ${p.preguntasIngles.length}`;
    }

    function ocultarContenido() {
        const qDisplay = document.getElementById('question-display');
        qDisplay.innerText = "Pulsa un botón para mostrar el contenido";
        qDisplay.style.color = "#94a3b8";
        qDisplay.style.fontStyle = "italic";
    }

    function mostrarContenido(lang, tipo) {
        window.speechSynthesis.cancel();
        const qDisplay = document.getElementById('question-display');
        const p = personajes[personajeActualId];
        let texto = "";
        
        if (tipo === 'pregunta') {
            texto = (lang === 'en') ? p.preguntasIngles[currentIndex] : p.preguntasEspanol[currentIndex];
        } else {
            texto = (lang === 'en') ? p.respuestasIngles[currentIndex] : p.respuestasEspanol[currentIndex];
        }

        qDisplay.innerText = texto;
        qDisplay.style.color = "var(--text-color)";
        qDisplay.style.fontStyle = "normal";
    }

    function hablarContenido(lang, tipo) {
        window.speechSynthesis.cancel();
        const p = personajes[personajeActualId];
        let texto = "";
        
        if (tipo === 'pregunta') {
            texto = (lang === 'en') ? p.preguntasIngles[currentIndex] : p.preguntasEspanol[currentIndex];
        } else {
            texto = (lang === 'en') ? p.respuestasIngles[currentIndex] : p.respuestasEspanol[currentIndex];
        }

        const utterance = new SpeechSynthesisUtterance(texto);

        // En la página de preguntas y respuestas se utilizan las mismas voces
        // seleccionadas en la página 2.
        const selectorVoz = (lang === 'en') ? 'select-voz-en' : 'select-voz-es';
        const voz = obtenerVozSeleccionada(selectorVoz);
        if (voz) {
            utterance.voice = voz;
            utterance.lang = voz.lang;
        } else {
            utterance.lang = (lang === 'en') ? 'en-US' : 'es-ES';
        }

        // Mantener también la velocidad elegida en la página 2.
        const selectorVelocidad = document.getElementById('velocidad-lectura');
        utterance.rate = selectorVelocidad ? parseFloat(selectorVelocidad.value) : 1;

        window.speechSynthesis.speak(utterance);
    }

function preguntaSiguiente() {
    window.speechSynthesis.cancel();
    const p = personajes[personajeActualId];

    if (currentIndex < p.preguntasIngles.length - 1) {
        currentIndex++;
    } else {
        currentIndex = 0;
    }

    actualizarContadorUI();
    ocultarContenido();
}

function preguntaAnterior() {
    window.speechSynthesis.cancel();
    const p = personajes[personajeActualId];

    if (currentIndex > 0) {
        currentIndex--;
    } else {
        currentIndex = p.preguntasIngles.length - 1;
    }

    actualizarContadorUI();
    ocultarContenido();
}
    
</script>

</body>
</html>
