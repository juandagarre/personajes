<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prueba de audio</title>
</head>
<body>

<h2>Prueba de audio desde servidor</h2>

<button onclick="reproducir()">▶ Reproducir</button>
<button onclick="parar()">■ Parar</button>

<p id="estado">Preparado</p>

<audio id="audio" preload="auto">
    <source src="audio/01.mp3" type="audio/mpeg">
</audio>

<script>
const audio = document.getElementById("audio");
const estado = document.getElementById("estado");

function reproducir() {
    estado.textContent = "Intentando reproducir...";
    
    audio.currentTime = 0;
    
    audio.play()
        .then(() => {
            estado.textContent = "Reproduciendo";
        })
        .catch(error => {
            estado.textContent =
                "ERROR: " + error.name + " - " + error.message;
        });
}

function parar() {
    audio.pause();
    audio.currentTime = 0;
    estado.textContent = "Parado";
}

audio.addEventListener("ended", () => {
    estado.textContent = "Terminado";
});

audio.addEventListener("error", () => {
    estado.textContent = "ERROR al cargar el audio";
});
</script>

</body>
</html>
